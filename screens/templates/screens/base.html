<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CardDemo</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: #9cff9c;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .terminal {
      width: min(96vw, 86ch);
      border: 1px solid #555;
      padding: 1rem;
      background: #050505;
      box-shadow: 0 12px 30px rgb(0 0 0 / 45%);
    }
    pre {
      margin: 0;
      font-size: clamp(11px, 1.45vw, 16px);
      line-height: 1.22;
      white-space: pre;
      letter-spacing: 0;
    }
    form { margin-top: 1rem; display: flex; flex-wrap: wrap; gap: .5rem; align-items: end; }
    label { display: grid; gap: .25rem; color: #d7d7d7; font-size: .85rem; }
    input {
      background: #111;
      border: 1px solid #555;
      color: #fff;
      padding: .45rem .55rem;
      font: inherit;
    }
    select {
      background: #111;
      border: 1px solid #555;
      color: #fff;
      padding: .45rem .55rem;
      font: inherit;
    }
    button {
      background: #234f23;
      color: #fff;
      border: 1px solid #6ca66c;
      padding: .5rem .65rem;
      font: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="terminal">
    <pre aria-label="3270 screen">{{ screen_text }}</pre>
    {% block form %}{% endblock %}
  </main>
</body>
</html>
