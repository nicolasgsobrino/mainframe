[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-mainframe-modernization-carddemo-python"
version = "0.1.0"
description = "Python/Django reimplementation of AWS CardDemo with PostgreSQL-backed COBOL data contracts."
requires-python = ">=3.11"
dependencies = [
  "django>=5.0,<6.0",
  "psycopg[binary]>=3.2,<4.0",
  "typer>=0.12,<1.0",
  "pika>=1.3,<2.0",
  "pytest>=8.0,<9.0",
  "pytest-django>=4.8,<5.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "carddemo.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
