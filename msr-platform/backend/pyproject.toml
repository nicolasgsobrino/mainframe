[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [".venv", "static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Código de simulación preexistente del PoC: se mantiene su estilo original.
"app/seed.py" = ["E702", "B007", "B905", "UP015", "I001"]
"app/engine.py" = ["E702", "F841", "I001"]
"app/store.py" = ["B007", "F841", "E741"]
"tests/*" = ["C408"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
